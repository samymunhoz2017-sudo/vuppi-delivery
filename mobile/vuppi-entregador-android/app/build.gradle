plugins { id 'com.android.application' }

def mapsKey = project.findProperty('VUPPI_MAPS_KEY') ?: System.getenv('VUPPI_MAPS_KEY') ?: System.getenv('GOOGLE_MAPS_ANDROID_KEY') ?: ''
def buildingRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (buildingRelease && !mapsKey) {
    throw new GradleException('VUPPI_MAPS_KEY is required for release builds. Refusing to generate an APK with a blank Google Maps key.')
}

android {
    namespace 'br.com.vuppidelivery.entregador'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'br.com.vuppidelivery.entregador'
        minSdk 24
        targetSdk 36
        versionCode 74
        versionName '0.74.0'
        manifestPlaceholders = [GOOGLE_MAPS_ANDROID_KEY: mapsKey]
    }
    signingConfigs {
        debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        production {
            storeFile file(System.getenv('VUPPI_KEYSTORE_FILE') ?: 'debug.keystore')
            storePassword System.getenv('VUPPI_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('VUPPI_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('VUPPI_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.production; minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
}


